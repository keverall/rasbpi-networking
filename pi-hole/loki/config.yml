auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  max_streams_per_user: 0
  max_line_size: 1048576
  allow_structured_metadata: false
  # Default max_query_series is 500, but the Unbound dashboard's Top Client
  # Queries panel (id=187) aggregates by domain+client across the full
  # $__range (up to 24h), which exceeds 500 unique series. Increase to 50000
  # to allow these aggregations to complete.
  max_query_series: 50000
