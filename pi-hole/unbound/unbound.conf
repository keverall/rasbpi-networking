server:
  # Working directory for unbound (no chroot below so Docker stdout is available)
  directory: "/opt/unbound/etc/unbound"
  # Drop privileges to this user after binding privileged ports
  username: "_unbound"
  # Log to a file so Promtail can read it. The file lives inside the
  # bind-mounted config dir (./unbound → /opt/unbound/etc/unbound) and
  # maps to the host path ./unbound/var/log/unbound.log, which is
  # mounted read-only into the promtail container.
  logfile: "var/log/unbound.log"
  # Use ISO-8601 timestamps so Promtail can parse them.
  log-time-ascii: yes
  # Keep unbound in foreground (required for Docker). Logs go to the
  # file above via logfile:, not to stderr.
  do-daemonize: no

  # Logging preferences
  # log-replies + log-tag-queryreply feed the Unbound 18077 dashboard's Loki
  # panels (promtail tags each line dns=reply / dns=block). verbosity 0 keeps
  # the log quiet apart from reply lines.
  log-local-actions: yes
  log-queries: yes
  log-replies: yes
  log-tag-queryreply: yes
  log-servfail: no
  verbosity: 0

  # Required for the full set of exporter metrics (cache/memory/request-list,
  # query-type and rcode counters) exposed on :9167.
  extended-statistics: yes

  # Listen on IPv4 and IPv6 on standard DNS port (53) so the image healthcheck succeeds
  interface: 0.0.0.0@53
  interface: ::0@53
  # Also listen on a secondary non-privileged port (5335) which is forwarded to the host loopback
  interface: 0.0.0.0@5335
  interface: ::0@5335

  do-ip4: yes
  do-ip6: yes
  do-udp: yes
  do-tcp: yes

  # Allow queries from internal networks (adjust if you want tighter access control)
  access-control: 0.0.0.0/0 allow
  root-hints: "root.hints"
  auto-trust-anchor-file: "var/root.key"
  hide-identity: yes
  hide-version: yes
  harden-glue: yes
  harden-dnssec-stripped: yes
  use-caps-for-id: yes
  qname-minimisation: yes
  prefetch: yes
  num-threads: 2
  msg-cache-size: 50m
  rrset-cache-size: 100m
  cache-min-ttl: 3600
  cache-max-ttl: 604800

remote-control:
  # Enable remote-control over TLS so unbound_exporter can scrape metrics
  control-enable: yes
  control-interface: 0.0.0.0
  control-port: 8953
  server-key-file: "unbound_server.key"
  server-cert-file: "unbound_server.pem"
  control-key-file: "unbound_control.key"
  control-cert-file: "unbound_control.pem"

# Add local overrides in 01-custom.conf (kept in the mounted config directory)
