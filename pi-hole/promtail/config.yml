server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://localhost:3100/loki/api/v1/push

scrape_configs:

  # Unbound: read the logfile written by the unbound container
  # (./unbound/var/log -> /var/log/unbound, bind-mounted ro here).
  # Tag reply/block lines with dns= so dashboard 18077's Loki panels select them.
  - job_name: unbound
    static_configs:
      - targets:
          - localhost
        labels:
          job: unbound
          __path__: /var/log/unbound/unbound.log
    pipeline_stages:
      - labeldrop:
          - filename
      - match:
          selector: '{job="unbound"} |~ " start | stopped |.*in-addr.arpa."'
          action: drop
      - match:
          selector: '{job="unbound"} |= "reply:"'
          stages:
            - static_labels:
                dns: reply
            # Normalise the syslog-style line
            #   "Aug 31 21:35:26 unbound[1:0] reply: <client> <domain> <type> <class> <rcode> <time> <cache> <len>"
            # into the 11-field shape dashboard 18077's `| pattern` expects:
            #   <_> <_> <_> <client> <domain> <type> <class> <rcode> <time> <cache> <len>
            # with the client at field 4 (pattern ignores fields 1-3).
            #
            # Promtail's replace stage only replaces capture-group text, preserving
            # non-captured parts of the match (unlike sed $1). So we use three
            # stages: regex extracts the content after "reply: ", output replaces
            # the log line with just that content (stripping the prefix), and a
            # final replace prepends the three `0` sentinel fields.
            - regex:
                expression: '^.*unbound\[[\d:]+\] reply: (?P<content>.*)$'
            - output:
                source: content
            - replace:
                expression: '^(.*)$'
                replace: '0 0 0 {{ .Value }}'
      - match:
          selector: '{job="unbound"} |~ "always_null|redirect |always_nxdomain"'
          stages:
            - static_labels:
                dns: block

  # Docker container logs (stdout/stderr JSON) for other containers.
  - job_name: containers
    static_configs:
      - targets:
          - localhost
        labels:
          job: containers
          __path__: /var/lib/docker/containers/*/*-json.log
    pipeline_stages:
      - docker: {}
      - timestamp:
          source: time
          format: "2006-01-02T15:04:05.999999999Z07:00"
