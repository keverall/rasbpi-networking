server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://localhost:3100/loki/api/v1/push

scrape_configs:

  # Unbound: read log file written by the unbound container (logfile: var/log/unbound.log)
  # The file is at /var/log/unbound/unbound.log inside this container via the
  # bind-mount ./unbound/var/log → /var/log/unbound:ro
  - job_name: unbound
    static_configs:
      - targets:
          - localhost
        labels:
          job: unbound
          __path__: /var/log/unbound/*.log
    pipeline_stages:
      - docker: {}
      - timestamp:
          source: time
          format: "2006-01-02T15:04:05.999999999Z07:00"
      - labels:
          level:

  # Docker container logs: reads stdout/stderr JSON logs from all containers
  # via the Docker API. This captures logs that go to the Docker logging
  # driver (e.g., Pi-hole, Grafana, Prometheus, Loki).
  - job_name: containers
    docker_logs:
      containers:
        - unbound
        - pihole
        - grafana
        - loki
        - prometheus
    pipeline-stages:
      - docker: {}
    relabel_configs:
      - source_labels: [container_name]
        target_label: job
