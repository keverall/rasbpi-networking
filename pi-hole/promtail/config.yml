server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://localhost:3100/loki/api/v1/push

scrape_configs:

  # Unbound: read log file written by the unbound container (logfile: var/log/unbound.log)
  # The file is at /var/log/unbound/unbound.log inside this container via the
  # bind-mount ./unbound/var/log → /var/log/unbound:ro
  # No pipeline_stages needed — unbound writes plain text, not Docker JSON.
  # Promtail uses its ingestion timestamp.
  - job_name: unbound
    static_configs:
      - targets:
          - localhost
        labels:
          job: unbound
          __path__: /var/log/unbound/*.log
    # Tag each line so the Unbound 18077 dashboard's Loki panels
    # ({dns="reply"} / {dns="block"}) can select them.
    # unbound reply/query lines (log-tag-queryreply: yes) look like:
    #   2026-08-31 17:00:00 [reply] <client> <domain> <type> <class> <rcode> <ttl> <len>
    pipeline_stages:
      - regex:
          expression: '^\S+\s+\S+\s+\[(?P<tag>reply|query|local|serve-expired|nside|prefetch)\]\s+\S.*$'
      - labels:
          dns:
            from: tag
            values:
              reply: 'reply'
              query: 'query'
              local: 'block'
              'serve-expired': 'reply'
              nside: 'reply'
              prefetch: 'reply'
      # Replies served from a blocklist (local-zone always/redirect) are still
      # logged as replies; relabel them as blocks for the dashboard.
      - match:
          selector: '{dns="reply"} |~ "(?i)always|redirect|block"'
          stages:
            - labels:
                dns: 'block'

  # Docker container logs: read stdout/stderr JSON log files from the Docker
  # daemon's container log directory. This captures logs from containers that
  # write to the Docker logging driver (default json-file), e.g., Pi-hole,
  # Grafana, Prometheus, Loki, node_exporter, etc.
  # Requires /var/lib/docker/containers mounted read-only (see docker-compose.yml).
  - job_name: containers
    static_configs:
      - targets:
          - localhost
        labels:
          job: containers
          __path__: /var/lib/docker/containers/*/*-json.log
    pipeline_stages:
      - docker: {}
      - timestamp:
          source: time
          format: "2006-01-02T15:04:05.999999999Z07:00"
