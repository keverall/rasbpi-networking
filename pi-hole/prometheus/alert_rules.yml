groups:
  - name: pihole_alerts
    rules:
      - alert: PiHoleDown
        expr: absent(up{job="pihole"} == 1)
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Pi-hole is down"

      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage"

      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage"

      - alert: DiskSpaceLow
        expr: (1 - (node_filesystem_avail_bytes{fstype!="tmpfs"} / node_filesystem_size_bytes{fstype!="tmpfs"})) * 100 > 90
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Disk space low"

      - alert: ContainerDown
        expr: absent(up{job="node_exporter"} == 1)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Container down"
