groups:
  - name: pihole_alerts
    rules:
      - alert: PiHoleDown
        expr: absent(up{job="pihole"} == 1)
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Pi-hole is down"
          description: "Pi-hole DNS blocker has been down for more than 5 minutes."

      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage detected"
          description: "CPU usage has been above 80% for more than 10 minutes."

      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
        for: 10m
 labels:
          severity: warning
        annotations:
          summary: "High memory usage detected"
          description: "Memory usage has been above 85% for more than 10 minutes."

      - alert: DiskSpaceLow
        expr: (1 - (node_filesystem_avail_bytes{fstype!="tmpfs"} / node_filesystem_size_bytes{fstype!="tmpfs"})) * 100 > 90
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Disk space running low"
          description: "Disk usage has been above 90% for more than 10 minutes."

      - alert: ContainerDown
        expr: absent(up{job="cadvisor"} == 1) or absent(up{job="node_exporter"} == 1)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Container monitoring down"
          description: "One or more monitoring containers are down."
