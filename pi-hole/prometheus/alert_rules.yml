groups:
  - name: pihole_alerts
    rules:
      - alert: PiHoleDown
        expr: absent(up{job="pihole"} == 1)
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Pi-hole is down"

      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage"

      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage"

      - alert: DiskSpaceLow
        expr: (1 - (node_filesystem_avail_bytes{fstype!="tmpfs"} / node_filesystem_size_bytes{fstype!="tmpfs"})) * 100 > 90
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Disk space low"

      - alert: ContainerDown
        expr: absent(up{job="node_exporter"} == 1)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Container down"

  - name: pi_health_alerts
    rules:
      # Processes stuck in uninterruptible sleep (D state) = I/O-blocked / "locked".
      - alert: LockedProcesses
        expr: node_procs_blocked > 5
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "Processes locked in uninterruptible sleep (D-state)"
          description: "{{ $value }} processes are stuck in D-state (node_procs_blocked > 5) for 3m. Usually indicates I/O or filesystem stall. Check the Pi diagnostics dashboard/logs."

      # Load average relative to available CPU cores (2x cores = saturated).
      - alert: HighLoadAverage
        expr: node_load1 > count by() (node_cpu_seconds_total{mode="idle"}) * 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High load average on pi-networking"
          description: "Load average ({{ $value | printf \"%.2f\" }}) exceeds 2x CPU cores for 10m."

      # Near out-of-memory (absolute available memory, complements HighMemoryUsage).
      - alert: LowMemoryAvailable
        expr: (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 < 10
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Memory nearly exhausted on pi-networking"
          description: "Available memory below 10% for 5m. Risk of OOM kill / lockup."

      # Thermal throttling risk; sustained high SoC temperature causes slowdowns.
      - alert: ThermalThrottle
        expr: raspi_cpu_temp_celsius > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Raspberry Pi SoC temperature high"
          description: "CPU temperature {{ $value }}C > 80C for 5m. Thermal throttling likely; check cooling."

  - name: stack_update_alerts
    rules:
      - alert: StackUpdateFailed
        expr: stack_update_run_outcome{outcome="failure"} == 1
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Weekly Docker stack update failed"
          description: "The Saturday stack update failed at the '{{ $labels.reason }}' step. Check logs/update-stack.log on pi-networking."

      - alert: StackUpdateMissed
        expr: time() - max(stack_update_last_success_ts) > 8 * 86400
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Weekly Docker stack update missed"
          description: "No successful stack update in over 8 days. Expected weekly on Saturday ~04:00."

      - alert: StackUpdateSucceeded
        expr: stack_update_run_outcome{outcome="success"} == 1
        for: 0m
        labels:
          severity: info
        annotations:
          summary: "Weekly Docker stack update succeeded"
          description: "The stack update completed. Upgraded images are listed on the 'Stack Update' Grafana dashboard."
