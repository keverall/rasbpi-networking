groups:
  - name: pihole_alerts
    rules:
      - alert: PiHoleDown
        expr: absent(up{job="pihole"} == 1)
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Pi-hole is down"

      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage"

      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage"

      - alert: DiskSpaceLow
        expr: (1 - (node_filesystem_avail_bytes{fstype!="tmpfs"} / node_filesystem_size_bytes{fstype!="tmpfs"})) * 100 > 90
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Disk space low"

      - alert: ContainerDown
        expr: absent(up{job="node_exporter"} == 1)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Container down"

  - name: stack_update_alerts
    rules:
      - alert: StackUpdateFailed
        expr: stack_update_run_outcome{outcome="failure"} == 1
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Weekly Docker stack update failed"
          description: "The Saturday stack update failed at the '{{ $labels.reason }}' step. Check logs/update-stack.log on pi-networking."

      - alert: StackUpdateMissed
        expr: time() - max(stack_update_last_success_ts) > 8 * 86400
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Weekly Docker stack update missed"
          description: "No successful stack update in over 8 days. Expected weekly on Saturday ~04:00."

      - alert: StackUpdateSucceeded
        expr: stack_update_run_outcome{outcome="success"} == 1
        for: 0m
        labels:
          severity: info
        annotations:
          summary: "Weekly Docker stack update succeeded"
          description: "The stack update completed. Upgraded images are listed on the 'Stack Update' Grafana dashboard."
