global:
  scrape_interval: 15s

rule_files:
  - "alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - "127.0.0.1:9093"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['127.0.0.1:9090']

  - job_name: 'pihole'
    static_configs:
      - targets: ['127.0.0.1:9617']

  - job_name: 'unbound'
    static_configs:
      - targets: ['192.168.1.5:9167']

  - job_name: 'node_exporter'
    static_configs:
      - targets: ['127.0.0.1:9100']

  - job_name: 'raspi_exporter'
    static_configs:
      - targets: ['127.0.0.1:9779']

  - job_name: 'grafana'
    static_configs:
      - targets: ['127.0.0.1:3000']

  - job_name: 'docker_exporter'
    static_configs:
      - targets: ['127.0.0.1:9200']
