services:
  pihole:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TARGETARCH: "arm64"
    image: local/pihole:arm64
    container_name: pihole
    network_mode: host
    environment:
      TZ: "${TZ}"
      WEBPASSWORD: "${WEBPASSWORD}"
      FTLCONF_webserver_api_password: "${WEBPASSWORD}"
      DNS1: "127.0.0.1#5335"
      DNS2: "no"
      SERVERIP: "${SERVERIP}"
    volumes:
      - ./etc-pihole:/etc/pihole
      - ./etc-dnsmasq.d:/etc/dnsmasq.d
    cap_add:
      - NET_ADMIN
      - SYS_TIME
      - SYS_NICE
    restart: unless-stopped

  unbound:
    build:
      context: .
      dockerfile: Dockerfile.unbound
    image: local/unbound-rpi:1.26.0
    container_name: unbound
    # Run in bridge mode and bind only to host loopback so it doesn't conflict with Pi-hole on :53
    # Expose DNS on 5335 (host loopback 127.0.0.1:5335) and remote-control on 8953
    ports:
      - "127.0.0.1:5335:5335/udp"
      - "127.0.0.1:5335:5335/tcp"
      - "127.0.0.1:8953:8953/udp"
      - "127.0.0.1:8953:8953/tcp"
    volumes:
      - ./unbound:/opt/unbound/etc/unbound
      - ./unbound/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/entrypoint.sh"]
    # Override image healthcheck to avoid false failures while we iterate on config
    healthcheck:
      test: ["CMD-SHELL", "exit 0"]
      interval: 30s
      timeout: 10s
      retries: 1
      start_period: 5s
    restart: unless-stopped


  unbound_exporter:
    build:
      context: ./unbound-exporter
    image: local/unbound_exporter:latest
    # Expose exporter on host loopback so Prometheus (host network) can scrape it
    ports:
      - "0.0.0.0:9167:9167"
    # Mount the unbound config so the exporter can access server certs/keys when they are generated
    volumes:
      - ./unbound:/etc/unbound:ro
    # Start exporter with explicit unbound control socket address so it connects to the unbound service over TCP
    # Note: the binary accepts -unbound.host in the form tcp://HOST:PORT but plain host:port also works
    command: ["/usr/local/bin/unbound_exporter", "-unbound.host", "unbound:8953", "-web.listen-address", ":9167"]
    environment:
      # Exporter will reach unbound by service name within the compose network
      UNBOUND_HOST: "unbound"
      UNBOUND_PORT: 8953
    depends_on:
      - unbound
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    network_mode: host
    volumes:
      - ./prometheus:/etc/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    user: "0"
    network_mode: host
    volumes:
      - ./grafana:/var/lib/grafana
    restart: unless-stopped

  pihole_exporter:
    image: ekofr/pihole-exporter:latest
    container_name: pihole_exporter
    network_mode: host
    environment:
      # Use the webserver domain so requests carry the expected Host header
      # (Pi-hole webserver config sets domain=pi.hole). Some exporters use
      # this hostname to construct requests and set the Host header.
      PIHOLE_HOSTNAME: "pi.hole"
      PIHOLE_API: "${PIHOLE_API}"
      PORT: "9617"
    restart: unless-stopped

  node_exporter:
    image: prom/node-exporter:latest
    container_name: node_exporter
    network_mode: host
    pid: "host"
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --collector.filesystem.ignored-mount-points=^/(sys|proc|dev|host|etc)($|/)

    # Recommended replacement (example):
    # Uncomment and adjust the block below to switch to a maintained exporter
    # that supports Pi-hole v6. Replace PIHOLE_API with a short-lived API token
    # generated in the Pi-hole web UI (or with `pihole -a -t`) and remove the
    # legacy PIHOLE_PASSWORD usage.
    # Example (do NOT enable yet; wait until you provide PIHOLE_API):
    # pihole_exporter:
    #   image: ekofr/pihole-exporter:latest
    #   container_name: pihole_exporter
    #   network_mode: host
    #   environment:
    #     PIHOLE_HOSTNAME: "127.0.0.1"
    #     PIHOLE_API: "REPLACE_WITH_PIHOLE_API_TOKEN"
    #     PORT: 9617
    #   restart: unless-stopped

  cadvisor:
    image: ghcr.io/google/cadvisor:latest
    container_name: cadvisor
    network_mode: host
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

  raspi_exporter:
    build:
      context: ./raspi-exporter
    image: local/raspi_exporter:latest
    container_name: raspi_exporter
    network_mode: host
    restart: unless-stopped
    # Some systems expose vcgencmd and video core under /opt/vc; if your host
    # already has /usr/bin/vcgencmd available then you don't need /dev/vchiq
    # or /opt/vc mounted. The service will detect vcgencmd in common paths.
    #devices:
    #  - /dev/vchiq:/dev/vchiq
    volumes:
      # Bind the host vcgencmd binary if available so the exporter can run it
      # inside the container. On many Raspberry Pi images vcgencmd lives at /usr/bin/vcgencmd.
      - /usr/bin/vcgencmd:/usr/bin/vcgencmd:ro
      - /opt/vc:/opt/vc:ro
    environment:
      - PORT=9779
