services:
  pihole:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TARGETARCH: arm64
    image: local/pihole:arm64
    container_name: pihole
    network_mode: host
    environment:
      TZ: ${TZ}
      WEBPASSWORD: ${WEBPASSWORD}
      FTLCONF_webserver_api_password: ${WEBPASSWORD}
      DNS1: 127.0.0.1#5335
      DNS2: 'no'
      SERVERIP: ${SERVERIP}
    volumes:
    - ./etc-pihole:/etc/pihole
    - ./etc-dnsmasq.d:/etc/dnsmasq.d
    cap_add:
    - NET_ADMIN
    - SYS_TIME
    - SYS_NICE
    # Critical: DNS resolution must not be starved
    mem_reservation: 256m
    mem_limit: 1g
    cpus: 1.0
    cpu_shares: 1024
    restart: unless-stopped

  unbound:
    build:
      context: .
      dockerfile: Dockerfile.unbound
    image: local/unbound-rpi:1.26.0
    container_name: unbound
    ports:
    - 127.0.0.1:5335:5335/udp
    - 127.0.0.1:5335:5335/tcp
    - 127.0.0.1:8953:8953/udp
    - 127.0.0.1:8953:8953/tcp
    volumes:
    - ./unbound:/opt/unbound/etc/unbound
    - ./unbound/entrypoint.sh:/entrypoint.sh:ro
    - ./unbound/var/log:/var/log/unbound
    entrypoint:
    - /entrypoint.sh
    healthcheck:
      test:
        - CMD-SHELL
        - exit 0
      interval: 30s
      timeout: 10s
      retries: 1
      start_period: 5s
    restart: unless-stopped
    # Critical: DNS-over-TLS resolver; must not be starved
    mem_reservation: 128m
    mem_limit: 512m
    cpus: 0.5
    cpu_shares: 1024

  unbound_exporter:
    build:
      context: ./unbound-exporter
    image: local/unbound_exporter:latest
    volumes:
    - ./unbound:/etc/unbound:ro
    command:
    - /usr/local/bin/unbound_exporter
    # ar51an/unbound-exporter: scrape via TLS over the unbound control socket.
    # Certs are the unbound remote-control certs in the mounted config dir.
    - -u
    - tcp://127.0.0.1:8953
    - -s
    - /etc/unbound/unbound_server.pem
    - -c
    - /etc/unbound/unbound_control.pem
    - -k
    - /etc/unbound/unbound_control.key
    # No blocklist configured; point blocklist counter at /dev/null so it
    # reports 0 instead of erroring.
    - -b
    - /dev/null
    - -a
    - 0.0.0.0:9167
    depends_on:
    - unbound
    restart: unless-stopped
    # Lightweight: exposes DNS metrics (matches the Unbound 18077 dashboard)
    mem_reservation: 32m
    mem_limit: 128m
    cpus: 0.2
    cpu_shares: 128

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    network_mode: host
    volumes:
    - ./prometheus:/etc/prometheus
    restart: unless-stopped
    # Important: metrics storage (tsdb) needs adequate memory
    mem_reservation: 512m
    mem_limit: 2g
    cpus: 1.0
    cpu_shares: 512

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    network_mode: host
    privileged: true
    volumes:
    - /:/rootfs:ro
    - /var/run:/var/run:ro
    - /sys:/sys:ro
    - /var/lib/docker/:/var/lib/docker:ro
    - /var/lib/containerd/:/var/lib/containerd:ro
    restart: unless-stopped
    # Exposes container_* metrics (CPU/memory/network) on :8080 for the
    # "Container CPU" / "Container Memory" dashboard panels.
    mem_reservation: 64m
    mem_limit: 256m
    cpus: 0.5
    cpu_shares: 256

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    user: '0'
    network_mode: host
    volumes:
    - ./grafana:/var/lib/grafana
    restart: unless-stopped
    # Important: dashboard rendering + alerting
    mem_reservation: 256m
    mem_limit: 1g
    cpus: 0.5
    cpu_shares: 512

  pihole_exporter:
    image: ekofr/pihole-exporter:latest
    container_name: pihole_exporter
    network_mode: host
    environment:
      PIHOLE_HOSTNAME: 127.0.0.1
      PIHOLE_PASSWORD: ${WEBPASSWORD}
      PORT: '9617'
    restart: unless-stopped
    # Lightweight: Pi-hole metrics
    mem_reservation: 32m
    mem_limit: 128m
    cpus: 0.1
    cpu_shares: 128

  node_exporter:
    image: prom/node-exporter:latest
    container_name: node_exporter
    network_mode: host
    pid: host
    restart: unless-stopped
    volumes:
    - /proc:/host/proc:ro
    - /sys:/host/sys:ro
    - /:/rootfs:ro
    command:
    - --path.procfs=/host/proc
    - --path.sysfs=/host/sys
    - --collector.filesystem.ignored-mount-points=^/(sys|proc|dev|host|etc)($|/)
    # Lightweight: system metrics
    mem_reservation: 32m
    mem_limit: 128m
    cpus: 0.1
    cpu_shares: 128

  raspi_exporter:
    build:
      context: ./raspi-exporter
    image: local/raspi_exporter:latest
    container_name: raspi_exporter
    network_mode: host
    restart: unless-stopped
    volumes:
    - /sys/class/thermal/thermal_zone0/temp:/sys/class/thermal/thermal_zone0/temp:ro
    environment:
    - PORT=9779
    # Lightweight: Pi thermal metrics
    mem_reservation: 32m
    mem_limit: 128m
    cpus: 0.1
    cpu_shares: 128

  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    network_mode: host
    volumes:
    - ./alertmanager:/etc/alertmanager
    command:
    - --config.file=/etc/alertmanager/config.yml
    - --storage.path=/alertmanager
    restart: unless-stopped
    # Lightweight: alert routing
    mem_reservation: 64m
    mem_limit: 256m
    cpus: 0.2
    cpu_shares: 128

  loki:
    image: grafana/loki:latest
    container_name: loki
    network_mode: host
    volumes:
    - ./loki/config.yml:/etc/loki/config.yml
    command: -config.file=/etc/loki/config.yml
    restart: unless-stopped
    # Important: log storage
    mem_reservation: 256m
    mem_limit: 1g
    cpus: 0.5
    cpu_shares: 512

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    user: '0'
    network_mode: host
    volumes:
    - ./promtail/config.yml:/etc/promtail/config.yml
    # Unbound logs to file via logfile directive; read by promtail job "unbound"
    - ./unbound/var/log:/var/log/unbound:ro
    # Docker container logs: mount container log directory so promtail can
    # read stdout/stderr JSON logs from all containers via static_configs
    # (Docker container log files are root:root 0640, hence user: '0' above)
    - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    restart: unless-stopped
    # Lightweight: log collection
    mem_reservation: 64m
    mem_limit: 256m
    cpus: 0.2
    cpu_shares: 128
