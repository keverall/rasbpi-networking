services:
  pihole:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TARGETARCH: arm64
    image: local/pihole:arm64
    container_name: pihole
    network_mode: host
    environment:
      TZ: ${TZ}
      WEBPASSWORD: ${WEBPASSWORD}
      FTLCONF_webserver_api_password: ${WEBPASSWORD}
      DNS1: 127.0.0.1#5335
      DNS2: 'no'
      SERVERIP: ${SERVERIP}
    volumes:
    - ./etc-pihole:/etc/pihole
    - ./etc-dnsmasq.d:/etc/dnsmasq.d
    cap_add:
    - NET_ADMIN
    - SYS_TIME
    - SYS_NICE
    restart: unless-stopped
  unbound:
    build:
      context: .
      dockerfile: Dockerfile.unbound
    image: local/unbound-rpi:1.26.0
    container_name: unbound
    ports:
    - 127.0.0.1:5335:5335/udp
    - 127.0.0.1:5335:5335/tcp
    - 127.0.0.1:8953:8953/udp
    - 127.0.0.1:8953:8953/tcp
    volumes:
    - ./unbound:/opt/unbound/etc/unbound
    - ./unbound/entrypoint.sh:/entrypoint.sh:ro
    - ./unbound/var/log:/var/log/unbound
    entrypoint:
    - /entrypoint.sh
    healthcheck:
      test:
      - CMD-SHELL
      - exit 0
      interval: 30s
      timeout: 10s
      retries: 1
      start_period: 5s
    restart: unless-stopped
  unbound_exporter:
    build:
      context: ./unbound-exporter
    image: local/unbound_exporter:latest
    volumes:
    - ./unbound:/etc/unbound:ro
    command:
    - /usr/local/bin/unbound_exporter
    - -unbound.host
    - 127.0.0.1:8953
    environment:
      UNBOUND_HOST: unbound
      UNBOUND_PORT: 8953
    depends_on:
    - unbound
    restart: unless-stopped
    network_mode: host
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    network_mode: host
    volumes:
    - ./prometheus:/etc/prometheus
    restart: unless-stopped
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    user: '0'
    network_mode: host
    volumes:
    - ./grafana:/var/lib/grafana
    restart: unless-stopped
  pihole_exporter:
    image: ekofr/pihole-exporter:latest
    container_name: pihole_exporter
    network_mode: host
    environment:
      PIHOLE_HOSTNAME: 127.0.0.1
      PIHOLE_PASSWORD: ${WEBPASSWORD}
      PORT: '9617'
    restart: unless-stopped
  node_exporter:
    image: prom/node-exporter:latest
    container_name: node_exporter
    network_mode: host
    pid: host
    restart: unless-stopped
    volumes:
    - /proc:/host/proc:ro
    - /sys:/host/sys:ro
    - /:/rootfs:ro
    command:
    - --path.procfs=/host/proc
    - --path.sysfs=/host/sys
    - --collector.filesystem.ignored-mount-points=^/(sys|proc|dev|host|etc)($|/)
  cadvisor:
    image: ghcr.io/google/cadvisor:latest
    container_name: cadvisor
    network_mode: host
    restart: unless-stopped
    volumes:
    - /:/rootfs:ro
    - /var/run:/var/run:rw
    - /sys:/sys:ro
    - /var/lib/docker/:/var/lib/docker:ro
    command:
    - --port=8081
  raspi_exporter:
    build:
      context: ./raspi-exporter
    image: local/raspi_exporter:latest
    container_name: raspi_exporter
    network_mode: host
    restart: unless-stopped
    volumes:
    - /sys/class/thermal/thermal_zone0/temp:/sys/class/thermal/thermal_zone0/temp:ro
    environment:
    - PORT=9779
  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    network_mode: host
    volumes:
    - ./alertmanager:/etc/alertmanager
    command:
    - --config.file=/etc/alertmanager/config.yml
    - --storage.path=/alertmanager
    restart: unless-stopped
  uptime-kuma:
    image: louislam/uptime-kuma:latest
    container_name: uptime-kuma
    network_mode: host
    volumes:
    - ./uptime-kuma:/app/data
    restart: unless-stopped
  loki:
    image: grafana/loki:latest
    container_name: loki
    network_mode: host
    volumes:
    - ./loki/config.yml:/etc/loki/config.yml
    command: -config.file=/etc/loki/config.yml
    restart: unless-stopped
  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    network_mode: host
    volumes:
    - ./promtail/config.yml:/etc/promtail/config.yml
    - ./unbound/var/log:/var/log/unbound:ro
    command: -config.file=/etc/promtail/config.yml
    restart: unless-stopped
