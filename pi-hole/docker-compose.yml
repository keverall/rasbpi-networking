version: "3.8"
services:
  pihole:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Ensure we build for the Pi 5's 64-bit ARM architecture
        TARGETARCH: "arm64"
    image: local/pihole:arm64
    container_name: pihole
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "80:80/tcp"
      - "443:443/tcp"
    environment:
      TZ: ${TZ}
      WEBPASSWORD: ${WEBPASSWORD}
      DNS1: ${DNS1}
      DNS2: ${DNS2}
      SERVERIP: ${SERVERIP}
    volumes:
      - ./etc-pihole:/etc/pihole:Z
      - ./etc-dnsmasq.d:/etc/dnsmasq.d:Z
    cap_add:
      - NET_ADMIN
    restart: unless-stopped

