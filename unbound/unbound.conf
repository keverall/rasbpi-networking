server:
  verbosity: 1
  # Listen on all interfaces so other containers in the Compose network can connect
  interface: 0.0.0.0
  # Also listen on IPv6
  interface: ::0
  # DNS listening port (non-privileged)
  port: 5335
  do-ip4: yes
  do-ip6: yes
  do-udp: yes
  do-tcp: yes
  hide-identity: yes
  hide-version: yes
  harden-glue: yes
  harden-dnssec-stripped: yes
  use-caps-for-id: yes
  edns-buffer-size: 1232
  prefetch: yes
  qname-minimisation: yes
  cache-min-ttl: 3600
  cache-max-ttl: 86400
  rrset-roundrobin: yes
  auto-trust-anchor-file: "var/root.key"
  do-daemonize: no
remote-control:
  # Remote-control disabled for now to avoid certificate/path issues in the container
  control-enable: no
  # If you enable remote-control later, use relative filenames (no leading slash) so they resolve inside the chroot
  # server-key-file: "unbound_server.key"
  # server-cert-file: "unbound_server.pem"
  # control-key-file: "unbound_control.key"
  # control-cert-file: "unbound_control.pem"
